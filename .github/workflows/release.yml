name: Release

# Builds both self-contained packages for Windows and Linux and publishes them to a GitHub
# Release, each with its runtime bundled in so end users install nothing:
#   * MAP Editor        — one-file PyInstaller executable (Python + Tkinter inside)
#   * WarehouseRouteApi  — self-contained .NET single-file server (.NET runtime inside) + map
#
# Cut a release by pushing a tag:  git tag v1.0.0 && git push origin v1.0.0
# Or run manually from the Actions tab (workflow_dispatch) to build+test without releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: MapEditor-linux
            binary: MapEditor
          - os: windows-latest
            artifact: MapEditor-windows.exe
            binary: MapEditor.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: MAP_Editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Tkinter is bundled-in-able
        run: python -c "import tkinter, tkinter.font; print('tkinter OK')"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Run model tests
        run: python test_warehouse_map.py
      - name: Build one-file executable
        run: pyinstaller --clean --noconfirm editor.spec
      # A windowed build has no stdout on Windows, so --selftest also writes to a file; we
      # check that plus the exit code. Start-Process -Wait is needed because the shell does
      # not block on a GUI-subsystem exe by default.
      - name: Smoke-test the executable (Linux)
        if: runner.os == 'Linux'
        run: |
          ./dist/MapEditor --selftest result.txt
          cat result.txt
          grep -q "SELFTEST OK" result.txt
      - name: Smoke-test the executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MapEditor.exe -ArgumentList '--selftest','result.txt' -Wait -PassThru
          Get-Content result.txt
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }
          if (-not (Select-String -Path result.txt -Pattern 'SELFTEST OK' -Quiet)) { throw "selftest did not report OK" }
      - name: Name the artifact per OS
        shell: bash
        run: mv "dist/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: MAP_Editor/dist/${{ matrix.artifact }}
          if-no-files-found: error

  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            package: WarehouseRouteApi-linux-x64
            exe: WarehouseRouteApi
          - os: windows-latest
            rid: win-x64
            package: WarehouseRouteApi-windows-x64
            exe: WarehouseRouteApi.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained single-file server
        shell: bash
        run: |
          dotnet publish WarehouseRouteApi/WarehouseRouteApi/WarehouseRouteApi.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false \
            -o publish

      - name: Smoke-test the server (Linux)
        if: runner.os == 'Linux'
        run: |
          cd publish
          ASPNETCORE_URLS=http://localhost:5252 ./WarehouseRouteApi &
          pid=$!
          ok=
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5252/api/route/locations >/dev/null; then ok=1; break; fi
            sleep 1
          done
          kill $pid 2>/dev/null || true
          test "$ok" = "1" || { echo "server did not respond"; exit 1; }
          echo "server responded OK"

      - name: Smoke-test the server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ASPNETCORE_URLS = "http://localhost:5252"
          $p = Start-Process -FilePath publish\WarehouseRouteApi.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://localhost:5252/api/route/locations -TimeoutSec 3 | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "server did not respond" }
          echo "server responded OK"

      - name: Zip the package (Linux)
        if: runner.os == 'Linux'
        run: cd publish && zip -qr "../${{ matrix.package }}.zip" . && cd ..

      - name: Zip the package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "${{ matrix.package }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}.zip
          if-no-files-found: error

  release:
    needs: [editor, server]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List collected artifacts
        run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true
